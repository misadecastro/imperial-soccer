<div class="bg-imperial-bg text-imperial-text min-h-screen flex flex-col pb-16">

  <!-- Header -->
  <header class="w-full bg-imperial-green shadow-md px-5 py-4 flex items-center gap-3">
    <svg class="w-8 h-8 text-white shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    <div>
      <div class="text-base font-bold text-white leading-tight">Imperial Soccer</div>
      <div class="text-xs text-white/70">Gestão de Usuários</div>
    </div>
  </header>

  <!-- Toast notification -->
  <div
    *ngIf="toast"
    class="fixed top-6 right-4 z-50 px-5 py-3 rounded-xl text-sm font-medium shadow-xl pointer-events-none max-w-xs text-white"
    [class.bg-imperial-green]="toast.type === 'success'"
    [class.bg-imperial-red]="toast.type === 'error'"
    role="status"
    aria-live="polite"
  >{{ toast.message }}</div>

  <!-- Main -->
  <main class="flex-1 w-full max-w-2xl mx-auto px-4 py-6 space-y-4">

    <div class="flex items-center justify-between mb-2">
      <h2 class="text-lg font-bold text-imperial-text">Usuários Cadastrados</h2>
      <button
        type="button"
        (click)="toggleCadastro()"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-imperial-green hover:opacity-90 text-white text-sm font-semibold transition-all duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-imperial-green focus:ring-offset-2"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        Novo Usuário
      </button>
    </div>

    <!-- ── Formulário de Cadastro ───────────────────────────────────────── -->
    <section *ngIf="mostrarCadastro">
      <form class="bg-imperial-card rounded-2xl p-5 space-y-4 border border-imperial-border shadow-sm" novalidate (ngSubmit)="submitCadastro()">

        <p *ngIf="erroCadastro" class="text-sm text-imperial-red" role="alert">{{ erroCadastro }}</p>

        <div>
          <label class="block text-sm font-medium text-imperial-text mb-1">Nome <span class="text-imperial-red">*</span></label>
          <input
            type="text"
            [(ngModel)]="novoNome"
            name="novoNome"
            placeholder="Nome completo"
            class="w-full px-4 py-2.5 rounded-lg bg-imperial-bg border border-imperial-border text-imperial-text placeholder-imperial-text-muted focus:outline-none focus:ring-2 focus:ring-imperial-green focus:border-transparent transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-imperial-text mb-1">E-mail <span class="text-imperial-red">*</span></label>
          <input
            type="email"
            [(ngModel)]="novoEmail"
            name="novoEmail"
            placeholder="usuario@imperial.com"
            class="w-full px-4 py-2.5 rounded-lg bg-imperial-bg border border-imperial-border text-imperial-text placeholder-imperial-text-muted focus:outline-none focus:ring-2 focus:ring-imperial-green focus:border-transparent transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-imperial-text mb-1">Senha inicial <span class="text-imperial-red">*</span></label>
          <input
            type="password"
            [(ngModel)]="novaSenha"
            name="novaSenha"
            placeholder="••••••••"
            class="w-full px-4 py-2.5 rounded-lg bg-imperial-bg border border-imperial-border text-imperial-text placeholder-imperial-text-muted focus:outline-none focus:ring-2 focus:ring-imperial-green focus:border-transparent transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-imperial-text mb-1">Papel <span class="text-imperial-red">*</span></label>
          <select
            [(ngModel)]="novoPapel"
            name="novoPapel"
            class="w-full px-4 py-2.5 rounded-lg bg-imperial-bg border border-imperial-border text-imperial-text focus:outline-none focus:ring-2 focus:ring-imperial-green focus:border-transparent transition-all"
          >
            <option *ngFor="let p of papeis" [value]="p">{{ p }}</option>
          </select>
        </div>

        <div class="pt-1 flex gap-3">
          <button type="submit" class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl bg-imperial-green hover:opacity-90 text-white font-semibold transition-all duration-200 shadow-md">Cadastrar</button>
          <button type="button" (click)="cancelarCadastro()" class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl border border-imperial-border text-imperial-text-muted hover:text-imperial-text font-medium transition-all">Cancelar</button>
        </div>

      </form>
    </section>

    <!-- ── Listagem ─────────────────────────────────────────────────────── -->
    <section class="space-y-2">

      <app-empty-state *ngIf="!carregando && usuarios.length === 0" message="Nenhum usuário cadastrado ainda."></app-empty-state>

      <div *ngFor="let u of usuarios" class="bg-imperial-card rounded-xl px-4 py-3 border border-imperial-border shadow-sm">

        <!-- Modo exibição -->
        <div *ngIf="editandoId !== u.id" class="flex items-center justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="font-semibold text-sm text-imperial-text truncate">{{ u.nome }}</div>
            <div class="text-xs text-imperial-text-muted">{{ u.email }}</div>
            <div class="flex items-center gap-2 mt-1">
              <span class="px-2 py-0.5 rounded-full bg-imperial-green-light text-imperial-green border border-imperial-green text-xs font-medium">{{ u.papel }}</span>
              <span *ngIf="!u.ativo" class="px-2 py-0.5 rounded-full bg-imperial-red-light text-imperial-red border border-imperial-red/30 text-xs font-medium">Inativo</span>
            </div>
          </div>
          <button
            type="button"
            (click)="iniciarEdicao(u)"
            class="px-3 py-1.5 rounded-lg text-xs font-medium border border-imperial-border text-imperial-text-muted hover:text-imperial-text hover:border-imperial-text-muted transition-all shrink-0"
          >Editar</button>
        </div>

        <!-- Modo edição -->
        <div *ngIf="editandoId === u.id" class="space-y-3">
          <p *ngIf="erroEdicao" class="text-sm text-imperial-red" role="alert">{{ erroEdicao }}</p>

          <div>
            <label class="block text-xs font-medium text-imperial-text mb-1">Nome</label>
            <input type="text" [(ngModel)]="editNome" [name]="'editNome_' + u.id" class="w-full px-3 py-2 rounded-lg bg-imperial-bg border border-imperial-border text-imperial-text text-sm focus:outline-none focus:ring-2 focus:ring-imperial-green" />
          </div>

          <div>
            <label class="block text-xs font-medium text-imperial-text mb-1">Papel</label>
            <select [(ngModel)]="editPapel" [name]="'editPapel_' + u.id" class="w-full px-3 py-2 rounded-lg bg-imperial-bg border border-imperial-border text-imperial-text text-sm focus:outline-none focus:ring-2 focus:ring-imperial-green">
              <option *ngFor="let p of papeis" [value]="p">{{ p }}</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-imperial-text mb-1">Nova senha (opcional)</label>
            <input type="password" [(ngModel)]="editNovaSenha" [name]="'editSenha_' + u.id" placeholder="Deixe em branco para não alterar" class="w-full px-3 py-2 rounded-lg bg-imperial-bg border border-imperial-border text-imperial-text text-sm placeholder-imperial-text-muted focus:outline-none focus:ring-2 focus:ring-imperial-green" />
          </div>

          <label class="flex items-center gap-2 text-sm text-imperial-text">
            <input type="checkbox" [(ngModel)]="editAtivo" [name]="'editAtivo_' + u.id" class="w-4 h-4 rounded" />
            Ativo
          </label>

          <div class="flex gap-3 justify-end pt-1">
            <button type="button" (click)="cancelarEdicao()" class="px-4 py-2 rounded-lg border border-imperial-border text-imperial-text-muted text-sm font-medium hover:text-imperial-text transition-all">Cancelar</button>
            <button type="button" (click)="salvarEdicao(u.id)" class="px-4 py-2 rounded-lg bg-imperial-green hover:opacity-90 text-white text-sm font-semibold transition-all shadow-md">Salvar</button>
          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- Menu de navegação inferior -->
  <nav class="fixed bottom-0 left-0 right-0 bg-imperial-card border-t border-imperial-border flex h-16 z-40">
    <a routerLink="/students" class="flex-1 flex flex-col items-center justify-center gap-1 text-imperial-text-muted hover:text-imperial-green transition-colors" aria-label="Alunos">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
      <span class="text-xs font-medium">Alunos</span>
    </a>
    <a routerLink="/training" class="flex-1 flex flex-col items-center justify-center gap-1 text-imperial-text-muted hover:text-imperial-green transition-colors" aria-label="Treino">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
      <span class="text-xs font-medium">Treino</span>
    </a>
    <a routerLink="/games" class="flex-1 flex flex-col items-center justify-center gap-1 text-imperial-text-muted hover:text-imperial-green transition-colors" aria-label="Jogos">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="14" r="6"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 8V5M10 5h4M12 14l2.5-2.5"/></svg>
      <span class="text-xs font-medium">Jogos</span>
    </a>
    <a routerLink="/dashboard" class="flex-1 flex flex-col items-center justify-center gap-1 text-imperial-text-muted hover:text-imperial-green transition-colors" aria-label="Dashboard">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6m0 13l-3-3m3 3l3-3M15 5v13m0-13l-3 3m3-3l3 3"/></svg>
      <span class="text-xs font-medium">Dashboard</span>
    </a>
    <a routerLink="/users" class="flex-1 flex flex-col items-center justify-center gap-1 text-imperial-green border-t-2 border-imperial-green font-semibold" aria-label="Usuários" aria-current="page">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-xs font-medium">Usuários</span>
    </a>
  </nav>

</div>
