<section class="bg-imperial-card rounded-2xl border border-imperial-border shadow-sm p-5">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-sm font-bold text-imperial-text">{{ tipo.nome }}</h3>
    <!-- Com avaliação: ícone no canto superior direito -->
    <button
      *ngIf="temAvaliacao"
      type="button"
      (click)="onAvaliar()"
      class="text-imperial-green hover:text-imperial-green/70"
      title="Avaliar"
      aria-label="Avaliar"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
    </button>
  </div>

  <!-- Com avaliação: radar -->
  <app-radar-chart *ngIf="temAvaliacao" [labels]="labels" [valores]="valores"></app-radar-chart>

  <!-- Sem avaliação: botão central com ícone de prancheta -->
  <div *ngIf="!temAvaliacao" class="flex flex-col items-center justify-center py-6">
    <button
      type="button"
      (click)="onAvaliar()"
      class="flex items-center gap-2 px-4 py-2 rounded-lg border border-imperial-green text-imperial-green text-sm font-medium hover:bg-imperial-green hover:text-white"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
      Avaliar
    </button>
  </div>
</section>
