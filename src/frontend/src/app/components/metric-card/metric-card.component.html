<div class="bg-imperial-card rounded-xl border border-imperial-border px-3 py-3 shadow-sm">
  <div class="flex items-center gap-1.5 text-xs text-imperial-text-muted">
    <svg *ngIf="icon === 'calendar'" class="w-3.5 h-3.5 text-imperial-green" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    <svg *ngIf="icon === 'clock'" class="w-3.5 h-3.5 text-imperial-green" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <svg *ngIf="icon === 'trend'" class="w-3.5 h-3.5 text-imperial-green" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
    <svg *ngIf="icon === 'list'" class="w-3.5 h-3.5 text-imperial-green" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
    <span>{{ label }}</span>
  </div>
  <div class="text-2xl font-bold mt-1 text-imperial-text">{{ value }}</div>
</div>
